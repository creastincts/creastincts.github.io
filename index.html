<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Awesomeness</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to right, #000000, #444444);
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid white;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        p {
            font-size: 18px;
            opacity: 0.8;
            color: #dddddd;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to Awesomeness</h1>
        <p>Experience the next level of greatness.</p>
    </div>
</body>

</html>
